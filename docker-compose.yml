services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: headsbase-ats-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: headsbase_ats
    volumes:
      - headsbase_pgdata:/var/lib/postgresql/data
      - ./prisma/docker/init-pgvector.sql:/docker-entrypoint-initdb.d/10-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d headsbase_ats"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: headsbase-ats-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  # Production database — NEVER remove this volume unless you have a backup.
  headsbase_pgdata:
