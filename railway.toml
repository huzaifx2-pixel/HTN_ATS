# Railway runs the full Next.js app (UI + API + workers) against Supabase.
# Nixpacks already runs `npm ci` in the install phase — do not run it again
# in buildCommand (cache mounts make a second `npm ci` fail with EBUSY).
[build]
builder = "NIXPACKS"
buildCommand = "npx prisma generate && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

