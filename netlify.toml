# Public site stays on Netlify; the full Next.js app runs on Railway.
[build]
  command = "node -e \"require('fs').mkdirSync('proxy-site',{recursive:true})\""
  publish = "proxy-site"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NEXT_TELEMETRY_DISABLED = "1"

[[redirects]]
  from = "/*"
  to = "https://web-production-3e5aa.up.railway.app/:splat"
  status = 200
  force = true
